name: 功能请求
description: 描述一个具体使用场景与新功能建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实使用场景与当前阻碍，避免只给结论。完整 map 动作目前仅支持 Windows PowerShell 5.1 / PowerShell 7。
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 你在做什么、在哪台机器与哪个前端上使用、涉及哪些工具
      placeholder: 例如：在 Codex 全局规则下让 agent 查找 node 并复用已登记副本
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: 当前阻碍
      description: 现状为什么无法满足场景，附上相关命令与观察到的返回
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为
      description: 你希望 toolkit-map 提供什么行为或输出，尽量可验证
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选：替代方案
      description: 你目前如何绕过，或其他可选做法
    validations:
      required: false
