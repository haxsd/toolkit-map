name: CI

# 三个平台的 job，核心都是"防止两份实现悄悄漂移"：
#   windows —— 在同一沙箱里同时跑 census.ps1（Windows PowerShell 5.1）与 census.sh，
#              断言两边都发现了沙箱里埋的同一批雷（tests/parity.ps1）
#   ubuntu  —— 在真 bash 下跑 census.sh 的冒烟测试，并给所有 .sh 做 bash -n
#   macos   —— 在系统自带的 bash 3.2 与 BSD 工具上跑同一份冒烟测试
#   windows-baseline —— 真实 runner 上跑一次 map.ps1 scan，记录首扫墙钟与进程数（只量不判）
# 不做的：不跑 bootstrap（它会真的改机器：写 PATH、写 profile、下载运行时）。
#
# 失败时把测试输出转发成 GitHub 注解（::error::）：注解可以匿名从 API 读到，
# 而 job 日志需要鉴权——无人值守时这是唯一能自己看到失败原因的通道。
#
# 注意 .sh 的可执行位：Windows 上创建的脚本默认是 100644，克隆到 Linux 后
# ./xxx.sh 会 Permission denied。仓库里必须用 `git update-index --chmod=+x` 钉住，
# 而 CI 的冒烟测试直接执行脚本，正好能拦住这类"在 Windows 上感觉没问题"的问题。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # 测试内部对每个子进程都有超时保护，这里再兜一道：宁可快速失败，也不要长期占着 runner
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      # 编码检查放在最前：.ps1 缺 BOM 时，英文系统的 ANSI 代码页（cp1252）会把中文注释
      # 读成智能引号、脚本直接解析失败——开发机是中文系统就完全看不见这个问题。
      - name: 脚本编码检查（.ps1 必须有 UTF-8 BOM）
        shell: powershell
        run: .\tests\check-encodings.ps1
      # 文档检查同样没有本地症状：只改了中英其中一份、或者搬动文件后留下失效链接，
      # 都要等别人打开仓库才发现。
      - name: 文档检查（单语与相对链接）
        shell: powershell
        run: .\tests\check-docs.ps1
      # 两个扫描内核共用 scripts/census-text.tsv：格式、中英齐全、引用可解析，并实际跑 -Lang en。
      - name: 文案表检查（PowerShell 5.1）
        shell: powershell
        run: .\tests\check-text.ps1
      - name: 文案表检查（PowerShell 7）
        shell: pwsh
        run: .\tests\check-text.ps1
      - name: 地图动作回归（失效路径与安装覆盖护栏）
        shell: powershell
        run: .\tests\map-smoke.ps1
      - name: 地图动作回归（PowerShell 7）
        shell: pwsh
        run: .\tests\map-smoke.ps1
      - name: 项目选择与接入契约（PowerShell 5.1）
        shell: powershell
        run: .\tests\map-contract.ps1
      - name: 项目选择与接入契约（PowerShell 7）
        shell: pwsh
        run: .\tests\map-contract.ps1
      - name: 版本比较与排序（PowerShell 5.1）
        shell: powershell
        run: .\tests\version-contract.ps1
      - name: 版本比较与排序（PowerShell 7）
        shell: pwsh
        run: .\tests\version-contract.ps1
      - name: 下载完整性与证书重试（PowerShell 5.1）
        shell: powershell
        run: .\tests\download-contract.ps1
      - name: 下载完整性与证书重试（PowerShell 7）
        shell: pwsh
        run: .\tests\download-contract.ps1
      - name: 扫描 shim 护栏
        shell: powershell
        run: .\tests\scan-guards.ps1
      - name: Portable 安装契约（不触网）
        shell: powershell
        run: .\tests\install-contract.ps1
      # 用 Windows PowerShell 5.1（系统自带）跑，因为这是 Windows 上最常见的宿主；
      # parity.ps1 自己会去找 Git Bash（windows-latest 自带）来跑 shell 版。
      - name: 一致性测试（census.ps1 vs census.sh）
        shell: powershell
        run: |
          # 输出同时进控制台和文件：失败时把文件尾部转成注解（注解可以匿名从 API 读到，
          # job 日志需要鉴权——无人值守时这是唯一能自己看到失败原因的通道）。
          $log = Join-Path $env:RUNNER_TEMP 'parity.log'
          try {
            & .\tests\parity.ps1 *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
          } catch {
            # 脚本抛异常时会在这里被接住：否则它只留一句"exit code 1"，什么线索都没有
            Write-Host "::error::parity.ps1 抛出异常: $($_.Exception.Message)"
            $code = 1
          }
          if ($code -ne 0) {
            $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
            Write-Host "::error::parity.ps1 退出码 $code，输出 $($lines.Count) 行"
            # 脚本可能在打印任何东西之前就退出（例如语法或宿主层面的问题），
            # 那种情况下只有 $Error 里有线索，所以一并带出来。
            foreach ($rec in @($Error | Select-Object -First 3)) {
              $msg = ($rec.ToString() -replace "`r?`n", ' ')
              if ($msg.Trim()) { Write-Host "::error::异常: $($msg.Trim())" }
            }
            $lines | Where-Object { $_.Trim() } | Select-Object -Last 30 |
              ForEach-Object { Write-Host "::error::$($_.Trim())" }
          }
          exit $code

      # 同一份测试再用 PowerShell 7 跑：parity.ps1 用当前宿主启动 census.ps1，
      # 这一步覆盖 census.ps1 在 PS7 下的行为（地图动作在 PS7 下调用的就是它）。
      - name: 一致性测试（PowerShell 7 宿主）
        shell: pwsh
        run: |
          # 输出同时进控制台和文件：失败时把文件尾部转成注解（注解可以匿名从 API 读到，
          # job 日志需要鉴权——无人值守时这是唯一能自己看到失败原因的通道）。
          $log = Join-Path $env:RUNNER_TEMP 'parity-ps7.log'
          try {
            & .\tests\parity.ps1 *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
          } catch {
            # 脚本抛异常时会在这里被接住：否则它只留一句"exit code 1"，什么线索都没有
            Write-Host "::error::parity.ps1 抛出异常: $($_.Exception.Message)"
            $code = 1
          }
          if ($code -ne 0) {
            $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
            Write-Host "::error::parity.ps1 退出码 $code，输出 $($lines.Count) 行"
            # 脚本可能在打印任何东西之前就退出（例如语法或宿主层面的问题），
            # 那种情况下只有 $Error 里有线索，所以一并带出来。
            foreach ($rec in @($Error | Select-Object -First 3)) {
              $msg = ($rec.ToString() -replace "`r?`n", ' ')
              if ($msg.Trim()) { Write-Host "::error::异常: $($msg.Trim())" }
            }
            $lines | Where-Object { $_.Trim() } | Select-Object -Last 30 |
              ForEach-Object { Write-Host "::error::$($_.Trim())" }
          }
          exit $code

  windows-baseline:
    # 收敛计划 P1：首扫并行化之前的基线。真实 runner 上用临时地图跑一次 map.ps1 scan，
    # 把墙钟时间与进程启动次数打成 ::notice 注解和 step summary（只量不判，不设阈值）。
    # 单独成 job：真实扫描的耗时随 runner 浮动，不该挤占 windows job 的 8 分钟预算。
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: 首扫基线（Windows PowerShell 5.1）
        shell: powershell
        run: .\tests\scan-baseline.ps1 -Label 'PS5.1'
      - name: 首扫基线（PowerShell 7）
        shell: pwsh
        run: .\tests\scan-baseline.ps1 -Label 'PS7'

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: shell 语法检查
        run: |
          for f in scripts/*.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
      # $VAR 后紧跟全角字符在 macOS 的 bash 3.2 上会被吞进变量名，统一要求 ${VAR}
      - name: .sh 变量引用检查（${VAR}）
        shell: bash
        run: bash tests/check-sh-vars.sh
      # 版本比较是纯函数，在 Linux 的 PowerShell 7 上也跑一遍，防止依赖 Windows 行为。
      - name: 版本比较与排序（Linux PowerShell 7）
        shell: pwsh
        run: ./tests/version-contract.ps1
      - name: 文案表检查（Linux PowerShell 7）
        shell: pwsh
        run: ./tests/check-text.ps1
      - name: 冒烟测试（census.sh）
        shell: bash
        run: |
          set +e
          bash tests/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败输出转成注解：日志需要鉴权，注解不需要
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < <(tail -n 35 "$RUNNER_TEMP/smoke.log")
          fi
          exit "$code"

  # macOS 自带的 /bin/bash 是 3.2，census.sh 承诺在上面开箱即用（不用 declare -A、不依赖 jq）。
  # smoke.sh 把 PATH 收窄到 /usr/bin:/bin，所以被测的 census.sh 实际跑在系统 bash 3.2 与 BSD 工具上。
  macos:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: shell 语法检查（/bin/bash 3.2）
        run: |
          /bin/bash --version | head -n1
          for f in scripts/*.sh tests/*.sh; do
            /bin/bash -n "$f" || exit 1
          done
      - name: .sh 变量引用检查（${VAR}，BSD grep）
        run: /bin/bash tests/check-sh-vars.sh
      - name: 冒烟测试（census.sh，macOS）
        shell: bash
        run: |
          set +e
          /bin/bash tests/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败输出转成注解：日志需要鉴权，注解不需要
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < <(tail -n 35 "$RUNNER_TEMP/smoke.log")
          fi
          exit "$code"
